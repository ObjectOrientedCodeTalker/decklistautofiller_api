name: Update card images and manifest

on:
  schedule:
    - cron: "0 9 * * *"   # daily at 09:00 UTC; only does work inside a release window
  workflow_dispatch:      # "Run workflow" button in the Actions tab
    inputs:
      force:
        description: "Run the update even if today isn't in a release window"
        type: boolean
        default: true

permissions:
  contents: write         # lets the job push its commit

concurrency:
  group: repo-writes      # shared with update-calendar so pushes never collide
  cancel-in-progress: false

jobs:
  # Offline check: reads release_calendar.json from the repo, contacts no website.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.window.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            release_calendar.py
            release_calendar.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Is today within 5 days of a TCG release?
        id: window
        run: python release_calendar.py check

  update:
    needs: check
    if: needs.check.outputs.run == 'true' || inputs.force
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download new cards and refresh manifest
        id: run
        # A few failed image downloads shouldn't block committing the rest;
        # they are retried automatically on the next run.
        continue-on-error: true
        run: python ygo_thumbs.py

      - name: Set latest released set and update date in info.json
        run: python release_calendar.py info

      - name: Commit and push changes
        run: |
          git add card_images_small manifest.json info.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          added=$(git diff --cached --name-only --diff-filter=A -- card_images_small | wc -l)
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-update cards ($added new images)"
          git push

      - name: Report failed downloads
        if: steps.run.outcome == 'failure'
        run: |
          [ -f failed.txt ] && cat failed.txt
          exit 1
